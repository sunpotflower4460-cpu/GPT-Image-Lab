name: Phase 1 Experiment

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: Four-digit experiment ID to execute
        required: true
        default: "0001"
        type: string
      critic_model:
        description: Vision critic model
        required: true
        default: "gpt-5.6-sol"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase1-experiment-${{ inputs.experiment_id }}
  cancel-in-progress: false

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXPERIMENT_ID: ${{ inputs.experiment_id }}
      CRITIC_MODEL: ${{ inputs.critic_model }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check API credential
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is not configured."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GPT-Image-Lab
        run: python -m pip install -e .

      - name: Preflight experiment
        run: |
          gpt-image-lab run "$EXPERIMENT_ID" \
            --critic-model "$CRITIC_MODEL" \
            --dry-run

      - name: Create review branch
        id: branch
        shell: bash
        run: |
          BRANCH="experiment/${EXPERIMENT_ID}-run-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Generate, critique, and validate
        run: |
          gpt-image-lab run "$EXPERIMENT_ID" \
            --critic-model "$CRITIC_MODEL"

      - name: Commit experiment evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "experiments/${EXPERIMENT_ID}"
          if git diff --cached --quiet; then
            echo "::error::The runner produced no repository changes to review."
            exit 1
          fi
          git commit -m "experiment: run ${EXPERIMENT_ID} for human review"
          git push origin "HEAD:${{ steps.branch.outputs.name }}"

      - name: Open human-review pull request
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<EOF
          ## Phase 1 experiment ${EXPERIMENT_ID}

          This pull request was created by the manual Phase 1 experiment workflow.

          ### Review before merge

          - inspect \`experiments/${EXPERIMENT_ID}/assets/result.png\u0060
          - inspect \`experiments/${EXPERIMENT_ID}/REVIEW.md\u0060
          - verify the visual critique is reasonable
          - verify the hypothesis result and candidate learning are supported by visible evidence
          - verify the next hypothesis is worth testing

          **This workflow intentionally did not finalize the experiment or append it to durable learning.**

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Experiment ${EXPERIMENT_ID}: generated result and critique" \
            --body-file /tmp/pr-body.md
